# aaPanel/Nginx reference vhost for pushstream.online.
# Let aaPanel manage certificate paths; place this logic inside the active SSL vhost.
server {
    listen 80;
    listen [::]:80;
    server_name pushstream.online www.pushstream.online;
    return 301 https://pushstream.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pushstream.online www.pushstream.online;

    # Replace with aaPanel-managed certificate paths.
    ssl_certificate     /www/server/panel/vhost/cert/pushstream.online/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/pushstream.online/privkey.pem;

    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /uploads/ {
        alias /www/wwwroot/pushstream.online/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:8021;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
